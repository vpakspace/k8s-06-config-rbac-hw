apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            # страница из ConfigMap подменяет каталог с html у nginx
            - name: web-content
              mountPath: /usr/share/nginx/html
              readOnly: true
        - name: multitool
          image: wbitt/network-multitool:3.24.4
          # nginx уже занял порт 80 в общем сетевом пространстве Pod'а, поэтому multitool уводим на другие порты
          env:
            - name: HTTP_PORT
              value: "1180"
            - name: HTTPS_PORT
              value: "11443"
          ports:
            - containerPort: 1180
      volumes:
        - name: web-content
          configMap:
            name: web-content
